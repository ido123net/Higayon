{% load static %}
<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>higayon · תשבצי היגיון</title>
  <link rel="stylesheet" href="{% static 'app.css' %}">
</head>
<body>
  <header>
    <a class="brand" href="/">higayon</a>
    {% if user.is_authenticated %}
      <button id="open-menu" class="icon-button" type="button" aria-label="פתיחת התפריט" aria-controls="site-menu" aria-haspopup="dialog">
        {% include 'menu_icon.html' with name='menu' only %}
      </button>
      <dialog id="site-menu" aria-labelledby="menu-title">
        <div class="drawer-heading">
          <h2 id="menu-title">תפריט</h2>
          <button class="icon-button" id="close-menu" type="button" aria-label="סגירת התפריט" autofocus>{% include 'menu_icon.html' with name='close' only %}</button>
        </div>
        <nav class="menu-panel" aria-label="תפריט האתר">
          {% block menu_content %}<a class="menu-row" href="/">לפתרון התשבץ</a>{% endblock %}
          <form method="post" action="/accounts/logout/">
            {% csrf_token %}
            <button class="menu-row logout" type="submit">{% include 'menu_icon.html' with name='exit' only %}יציאה</button>
          </form>
        </nav>
      </dialog>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% if user.is_authenticated %}<script type="module" src="{% static 'menu.js' %}"></script>{% endif %}
</body>
</html>
