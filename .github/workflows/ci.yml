name: CI
on:
  pull_request:
  workflow_call:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_USER: postgres
          POSTGRES_DB: higayon
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d higayon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for credentials
        run: |
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --volume "$PWD:/repo:ro" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact=100 --no-banner --log-opts=--all .
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.5
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked ty check
      - run: uv run --locked python manage.py check
      - run: uv run --locked python manage.py makemigrations --check --dry-run
      - run: uv run --locked python manage.py test
      - run: uv run --locked python manage.py test
        env:
          DATABASE_URL: postgresql://postgres:test-only@127.0.0.1:5432/higayon
      - run: node --test tests/browser-units.mjs
      - run: uv run --locked python manage.py test tests.browser_smoke.BrowserTests tests.browser_sessions.SharedBrowserTests
      - run: uv run --locked python -m tests.live_solving
      - run: uv run --locked python -m tests.live_solving
        env:
          LIVE_TEST_POSTGRES: postgresql://postgres:test-only@127.0.0.1:5432/higayon
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform validate
      - run: docker build --tag higayon:ci .
