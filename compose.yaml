services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: higayon
      POSTGRES_USER: higayon
      POSTGRES_PASSWORD: local-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U higayon"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres:
