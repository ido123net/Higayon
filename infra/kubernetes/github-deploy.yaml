apiVersion: v1
kind: ServiceAccount
metadata:
  name: higayon-github-deploy
  namespace: higayon
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: higayon-github-deploy
  namespace: higayon
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [higayon]
    verbs: [get, list, watch, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: higayon-github-deploy
  namespace: higayon
subjects:
  - kind: ServiceAccount
    name: higayon-github-deploy
    namespace: higayon
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: higayon-github-deploy
